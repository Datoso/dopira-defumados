<script src="js/ui.js"></script>
<script>
  // ícones do topo
  document.getElementById('btnVoltar').innerHTML = UI.ICON.voltar;
  const s = document.getElementById('btnSite'); s.innerHTML = UI.ICON.site; s.href = UI.URL_SITE;
  document.querySelector('.topo-acoes a[href="#/ajustes"]').innerHTML = UI.ICON.ajustes;
